[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --tb=short
    -ra
    --strict-markers
    --strict-config
markers =
    integration: marks tests as integration (require real files or more setup)
    slow: marks tests as slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.generativeai*
    ignore::FutureWarning:google.generativeai*